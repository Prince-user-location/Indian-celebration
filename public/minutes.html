<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Weekly Grocery - Indian Celebration</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- HEADER WITH BACK BUTTON -->
    <div class="header">
        <div class="top-tabs">
            <div class="tab-box" onclick="window.location.href='minutes.html'">
                <img src="https://cdn-icons-png.flaticon.com/512/3724/3724788.png">
                <span>Weekly</span>
            </div>
            <div class="tab-box" onclick="alert('Travel Page Coming Soon')">
                <img src="https://cdn-icons-png.flaticon.com/512/3125/3125713.png"><span>Travel</span>
            </div>
            <div class="tab-box" onclick="window.location.href='value365.html'">
                <img src="https://cdn-icons-png.flaticon.com/512/3081/3081559.png"><span>Value 365</span>
            </div>
            <!-- FIXED: Gift Box Icon -->
            <div class="tab-box" onclick="alert('Gifts Page Coming Soon')">
                <img src="https://cdn-icons-png.flaticon.com/512/2885/2885408.png"><span>Gifts</span>
            </div>
        </div>

        <div class="header-top" style="margin-top: 10px;">
            <!-- BACK BUTTON -->
            <div style="display:flex; align-items:center; gap:10px;">
                <svg onclick="window.location.href='index.html'" width="24" height="24" viewBox="0 0 24 24" fill="#333" style="cursor:pointer;"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                <div class="logo-text" style="font-size: 18px;">Weekly Grocery</div>
            </div>
            
            <div class="header-icons">
                <svg onclick="handleProfileClick()" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <svg onclick="window.location.href='help.html'" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg>
                <svg onclick="openCart()" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </div>
        </div>

        <div class="location-bar" onclick="openLocationModal()">
            <svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            <span id="headerLocationText">Select delivery location ></span>
        </div>

        <div class="search-container">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="mainSearchInput" placeholder="Search for Products...">
        </div>
    </div>

    <!-- BANNER -->
    <div class="banner-container">
        <div class="banner-slider" id="slider"></div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="section-title">Weekly Grocery Needs</div>
    
    <div class="grid" id="weeklyGrid">
        <p style="grid-column: span 2; text-align:center; padding:20px;">Loading products...</p>
    </div>

    <!-- FLOATING BOTTOM NAVIGATION -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='index.html'"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</div>
        <div class="nav-item active"><svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>Categories</div>
        <div class="nav-item" onclick="window.location.href='index.html'"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>Account</div>
        <div class="nav-item" onclick="window.location.href='index.html'"><svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>Cart</div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/search.js"></script>
    <script src="js/theme-color.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/products');
                const allProducts = await res.json();
                const weeklyProducts = allProducts.filter(p => p.category === 'minutes');
                
                const container = document.getElementById('weeklyGrid');
                if(weeklyProducts.length === 0) {
                    container.innerHTML = '<p style="grid-column: span 2; text-align:center;">No products found.</p>';
                    return;
                }

                let html = '';
                weeklyProducts.forEach(p => {
                    html += `
                        <div class="card">
                            <div class="card-img-container" onclick="window.location.href='product.html?id=${p._id}'">
                                <img src="${p.imageUrl}" class="card-img">
                            </div>
                            <div class="card-details">
                                <div class="brand-name">Grocery</div>
                                <div class="card-title" onclick="window.location.href='product.html?id=${p._id}'">${p.name}</div>
                                <div class="price-row"><span class="price">₹${p.price}</span></div>
                                <div class="card-btn-group">
                                    <button class="btn-add-meesho" onclick="event.stopPropagation(); addToCart('${p._id}')">Add</button>
                                    <button class="btn-buy-meesho" onclick="event.stopPropagation(); buyNowDirect('${p._id}')">Buy Now</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (e) {
                console.log("Error loading products", e);
            }
        });
    </script>
</body>
</html>
