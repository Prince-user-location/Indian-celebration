<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Account - Indian Celebration</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background: #f1f3f6; font-family: var(--font-main); margin: 0; padding: 0; padding-bottom: 80px; }
        .profile-header { background: #fff; padding: 15px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .profile-header h2 { font-size: 18px; font-weight: 700; margin: 0; color: #212121; }
        .profile-banner-container { width: 100%; height: 160px; background-color: #e0e0e0; background-size: cover; background-position: center; position: relative; }
        .profile-banner-container::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 50%; background: linear-gradient(to top, rgba(255,255,255,1), transparent); }
        
        .logged-in-top { padding: 15px 20px; display: flex; justify-content: space-between; align-items: flex-end; margin-top: -30px; position: relative; z-index: 2; }
        .user-greeting { font-size: 26px; font-weight: 800; color: #0f1111; margin: 0; }
        .help-btn { display: flex; align-items: center; gap: 5px; padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; background: #fff; color: #333; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border:none; }
        
        /* CLEAN SECTIONS (No Borders) */
        .section-box { background: #fff; margin-bottom: 10px; padding: 15px 20px; }
        .row-cards { display: flex; gap: 10px; }
        .action-card { flex: 1; border: 1px solid #f0f0f0; border-radius: 12px; padding: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; background: #fff; }
        .action-card span { font-size: 14px; font-weight: 700; color: #212121; }
        .section-title { font-size: 18px; font-weight: 700; color: #0f1111; margin-bottom: 15px; }
        .list-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #f9f9f9; cursor: pointer; }
        .list-item:last-child { border-bottom: none; }
        .list-left { display: flex; align-items: center; gap: 15px; flex: 1; }
        .list-left span { font-size: 15px; color: #212121; font-weight: 500; }
        .sub-text { font-size: 12px; color: #878787; margin-top: 2px; }
    </style>
</head>
<body>

    <div class="profile-header">
        <div onclick="window.location.href='index.html'" style="cursor:pointer;"><svg width="24" height="24" viewBox="0 0 24 24" fill="#333"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></div>
        <h2>Account</h2>
        <div style="width:24px;"></div>
    </div>

    <div id="loggedInView">
        <div class="profile-banner-container" id="profileBannerImg"></div>
        <div class="logged-in-top">
            <h2 class="user-greeting" id="greetingText">Hey, User</h2>
            <button class="help-btn" onclick="window.location.href='help.html'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#333"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg> Help
            </button>
        </div>

        <div class="section-box">
            <div class="row-cards">
                <div class="action-card" onclick="window.location.href='my-orders.html'"><svg width="28" height="28" viewBox="0 0 24 24" fill="#2874f0"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg><span>Orders</span></div>
                <div class="action-card" onclick="window.location.href='my-wishlist.html'"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2874f0" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><span>Wishlist</span></div>
            </div>
        </div>

        <div class="section-box">
            <div class="section-title">Finance Options</div>
            <div class="list-item" onclick="alert('Coming Soon')"><div class="list-left"><svg width="22" height="22" viewBox="0 0 24 24" fill="#388e3c"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg><div><span>Instant Loan</span><div class="sub-text">Loan Mela Live</div></div></div><svg width="16" height="16" viewBox="0 0 24 24" fill="#878787"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg></div>
            <div class="list-item" onclick="alert('Coming Soon')"><div class="list-left"><svg width="22" height="22" viewBox="0 0 24 24" fill="#1e88e5"><path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg><div><span>Supermoney Card</span><div class="sub-text">1% cashback</div></div></div><svg width="16" height="16" viewBox="0 0 24 24" fill="#878787"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg></div>
        </div>

        <div class="section-box">
            <div class="section-title">Profile Settings</div>
            <div class="list-item" onclick="window.location.href='edit-profile.html'"><div class="list-left"><svg width="22" height="22" viewBox="0 0 24 24" fill="#2874f0"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>Edit profile</span></div><svg width="16" height="16" viewBox="0 0 24 24" fill="#878787"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg></div>
            <div class="list-item" onclick="alert('Coming Soon')"><div class="list-left"><svg width="22" height="22" viewBox="0 0 24 24" fill="#2874f0"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg><span>Saved addresses</span></div><svg width="16" height="16" viewBox="0 0 24 24" fill="#878787"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg></div>
        </div>

        <div class="section-box">
            <div class="list-item" onclick="handleLogout()"><div class="list-left"><svg width="22" height="22" viewBox="0 0 24 24" fill="#d32f2f"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg><span style="color:#d32f2f; font-weight:700;">Logout</span></div></div>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='index.html'"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</div>
        <div class="nav-item" onclick="window.location.href='category.html'"><svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>Categories</div>
        <div class="nav-item active"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>Account</div>
        <div class="nav-item" onclick="window.location.href='index.html?cart=true'"><svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>Cart</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (currentUser) {
                document.getElementById('loggedInView').style.display = 'block';
                document.getElementById('greetingText').innerText = `Hey, ${currentUser.name.split(' ')[0]}`;
            } else { window.location.href = 'index.html?login=true'; }

            try {
                const res = await fetch('/api/settings');
                const settings = await res.json();
                if(settings.profileBanner) {
                    document.getElementById('profileBannerImg').style.backgroundImage = `url(${settings.profileBanner})`;
                }
            } catch(e) { console.log(e); }
        });

        function handleLogout() {
            if(confirm("Kya aap logout karna chahte hain?")) {
                localStorage.removeItem('currentUser');
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
