<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Account - Indian Celebration</title>
    
    <!-- FIX: Absolute Path for CSS -->
    <link rel="stylesheet" href="/css/style.css">
    
    <style>
        /* FIX: Improved padding so content doesn't hide behind bottom nav */
        body { background: #f1f3f6; font-family: var(--font-main, 'Inter', sans-serif); margin: 0; padding: 0; padding-bottom: 120px; }

        /* HEADER */
        .profile-header { background: #fff; padding: 15px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .profile-header h2 { font-size: 18px; font-weight: 700; margin: 0; color: #212121; }

        /* PROFILE BANNER */
        .profile-banner-container {
            width: 100%;
            height: 160px;
            background-color: #e0e0e0;
            background-image: url('https://images.unsplash.com/photo-1607083206869-4c7672e72a8a?w=800');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .profile-banner-container::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 50%;
            background: linear-gradient(to top, rgba(255,255,255,1), transparent);
        }

        /* TOP GREETING */
        .logged-in-top { background: transparent; padding: 15px 20px; display: flex; justify-content: space-between; align-items: flex-end; margin-top: -30px; position: relative; z-index: 2; }
        .user-greeting { font-size: 26px; font-weight: 800; color: #0f1111; margin: 0; }
        .help-btn { display: flex; align-items: center; gap: 5px; border: 1px solid #ccc; padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; background: #fff; color: #333; margin-bottom: 5px; }

        /* SECTIONS */
        .section-box { background: #fff; margin-bottom: 10px; padding: 15px 20px; border-radius: 12px; margin-left: 15px; margin-right: 15px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
        .row-cards { display: flex; gap: 10px; }
        .action-card { flex: 1; border: 1px solid #e0e0e0; border-radius: 12px; padding: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; background: #fff; transition: 0.2s; }
        .action-card:active { background: #f9f9f9; }
        .action-card span { font-size: 14px; font-weight: 700; color: #212121; }

        .section-title { font-size: 18px; font-weight: 700; color: #0f1111; margin-bottom: 15px; }

        .list-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .list-item:last-child { border-bottom: none; }
        .list-left { display: flex; align-items: center; gap: 15px; flex: 1; }
        .list-left span { font-size: 15px; color: #212121; font-weight: 500; }
        .sub-text { font-size: 12px; color: #878787; margin-top: 2px; }

        /* --- FIX: FORM INPUT STYLES (Screenshot 1 Fix) --- */
        .form-container { padding: 20px; background: #fff; border-radius: 12px; margin: 15px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
        .form-container h3 { margin: 0 0 15px 0; font-size: 18px; color: #212121; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 12px 15px; border: 1px solid #dcdcdc; border-radius: 8px; font-size: 14px; font-family: inherit; background: #fafafa; box-sizing: border-box; }
        .input-group input:focus { border-color: #2874f0; background: #fff; outline: none; }
        
        .btn-blue-login { width: 100%; padding: 14px; background: #2874f0; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 5px; }
        .btn-blue-login:active { background: #1a5bbf; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="profile-header">
        <div onclick="window.location.href='index.html'" style="cursor:pointer;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#333"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </div>
        <h2>Account</h2>
        <div style="width:24px;"></div>
    </div>

    <!-- LOGGED IN VIEW -->
    <div id="loggedInView" style="display: none;">
        <div class="profile-banner-container" id="profileBannerImg"></div>

        <div class="logged-in-top">
            <h2 class="user-greeting" id="greetingText">Hey, User</h2>
            <div class="help-btn" onclick="window.location.href='help.html'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#333"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg> Help
            </div>
        </div>

        <div class="section-box">
            <div class="row-cards">
                <div class="action-card" onclick="window.location.href='my-orders.html'">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="#2874f0"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
                    <span>Orders</span>
                </div>
                <div class="action-card" onclick="window.location.href='my-wishlist.html'">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2874f0" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                    <span>Wishlist</span>
                </div>
            </div>
        </div>

        <div class="section-box">
            <div class="section-title">Profile Settings</div>
            <div class="list-item" onclick="window.location.href='edit-profile.html'">
                <div class="list-left">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="#2874f0"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    <span>Edit profile</span>
                </div>
            </div>
        </div>

        <div class="section-box">
            <div class="list-item" onclick="handleLogout()">
                <div class="list-left"><svg width="22" height="22" viewBox="0 0 24 24" fill="#d32f2f"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg><span style="color:#d32f2f; font-weight:700;">Logout</span></div>
            </div>
        </div>
    </div>

    <!-- LOGGED OUT VIEW (Screenshot 1 FIX) -->
    <!-- Yahan humne proper Login Form aur Address Form daal diya hai jo pehle raw dikh raha tha -->
    <div id="loggedOutView" style="display: none;">
        
        <div class="form-container">
            <h3>Welcome to Indian Celebration</h3>
            <p style="font-size:13px; color:#777; margin-bottom:15px;">Login or create an account to continue</p>
            
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password">
            </div>
            <button class="btn-blue-login" onclick="handleLogin()">Login</button>
            <button class="btn-blue-login" style="background:#fff; color:#2874f0; border:1px solid #2874f0; margin-top:10px;">Register</button>
        </div>

        <!-- My Orders & Wishlist Links -->
        <div class="section-box">
            <div class="list-item" onclick="window.location.href='my-orders.html'">
                <div class="list-left"><span>← My Orders</span></div>
            </div>
            <div class="list-item" onclick="window.location.href='my-wishlist.html'">
                <div class="list-left"><span>← My Wishlist</span></div>
            </div>
        </div>

        <!-- Delivery Address Section -->
        <div class="form-container">
            <h3>Delivery Address</h3>
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" placeholder="Full Name">
            </div>
            <div class="input-group">
                <label>Full Address</label>
                <input type="text" placeholder="House no, Street, Area">
            </div>
            <div class="input-group">
                <label>State</label>
                <input type="text" placeholder="State">
            </div>
            <div class="input-group">
                <label>PIN Code</label>
                <input type="text" placeholder="PIN Code">
            </div>
        </div>

    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='index.html'"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</div>
        <div class="nav-item" onclick="window.location.href='category.html'"><svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>Categories</div>
        <div class="nav-item active"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>Account</div>
        <div class="nav-item" onclick="window.location.href='index.html?cart=true'"><svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>Cart</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (currentUser) {
                // User Logged In
                document.getElementById('loggedOutView').style.display = 'none';
                document.getElementById('loggedInView').style.display = 'block';
                const firstName = currentUser.name ? currentUser.name.split(' ')[0] : 'User';
                document.getElementById('greetingText').innerText = `Hey, ${firstName}`;
            } else {
                // User Logged Out
                document.getElementById('loggedOutView').style.display = 'block';
                document.getElementById('loggedInView').style.display = 'none';
            }

            // FETCH DYNAMIC PROFILE BANNER
            try {
                const res = await fetch('/api/settings');
                const settings = await res.json();
                if(settings.profileBanner) {
                    document.getElementById('profileBannerImg').style.backgroundImage = `url(${settings.profileBanner})`;
                }
            } catch(e) { console.log("Error fetching banner settings", e); }
        });

        // Fake Login Function (Aap isko apne backend login API se replace karein)
        function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            if(!email) { alert("Please enter email"); return; }
            
            // Demo User Save in LocalStorage
            const user = { name: "Demo User", email: email };
            localStorage.setItem('currentUser', JSON.stringify(user));
            alert("Logged in successfully!");
            window.location.reload(); 
        }

        function handleLogout() {
            if(confirm("Kya aap logout karna chahte hain?")) {
                localStorage.removeItem('currentUser');
                alert("Logged out successfully!");
                window.location.reload();
            }
        }
    </script>
</body>
</html>
