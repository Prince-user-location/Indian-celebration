<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Account - Indian Celebration</title>
    
    <!-- FIX: Absolute Paths -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/profile.css">
</head>
<body>

    <!-- HEADER -->
    <div class="profile-header">
        <div onclick="window.location.href='index.html'" style="cursor:pointer;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#333"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </div>
        <h2>Account</h2>
        <div style="width:24px;"></div>
    </div>

    <!-- LOGGED IN VIEW -->
    <div id="loggedInView" style="display: none;">
        <div class="profile-banner-container" id="profileBannerImg"></div>

        <div class="logged-in-top">
            <h2 class="user-greeting" id="greetingText">Hey, User</h2>
            <div class="help-btn" onclick="window.location.href='help.html'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#333"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg> Help
            </div>
        </div>

        <div class="section-card">
            <div class="row-cards" style="display:flex; gap:10px;">
                <div class="action-card" onclick="window.location.href='my-orders.html'" style="flex:1; border:1px solid #e0e0e0; border-radius:12px; padding:15px; display:flex; align-items:center; justify-content:center; gap:10px; cursor:pointer; background:#fff;">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="#2874f0"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
                    <span style="font-size:14px; font-weight:700; color:#212121;">Orders</span>
                </div>
                <div class="action-card" onclick="window.location.href='my-wishlist.html'" style="flex:1; border:1px solid #e0e0e0; border-radius:12px; padding:15px; display:flex; align-items:center; justify-content:center; gap:10px; cursor:pointer; background:#fff;">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2874f0" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                    <span style="font-size:14px; font-weight:700; color:#212121;">Wishlist</span>
                </div>
            </div>
        </div>

        <div class="section-card">
            <h3>Profile Settings</h3>
            <div class="list-item" onclick="window.location.href='edit-profile.html'">
                <div class="list-left">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="#2874f0"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    <span>Edit profile</span>
                </div>
            </div>
        </div>

        <div class="section-card">
            <div class="list-item" onclick="handleLogout()">
                <div class="list-left"><svg width="22" height="22" viewBox="0 0 24 24" fill="#d32f2f"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg><span style="color:#d32f2f; font-weight:700;">Logout</span></div>
            </div>
        </div>
    </div>

    <!-- LOGGED OUT VIEW (FIXED FOR SCREENSHOT 1) -->
    <div id="loggedOutView" style="display: none;">
        
        <div class="section-card" style="margin-top: 15px;">
            <h1 class="welcome-title">Welcome to Indian Celebration</h1>
            <p class="welcome-subtitle">Login or create an account to continue</p>

            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-primary">Login</button>
                <button type="button" class="btn-primary btn-secondary">Register</button>
            </form>
        </div>

        <!-- My Orders & Wishlist Links -->
        <div class="section-card" style="padding: 10px 20px;">
            <div class="list-item" onclick="window.location.href='my-orders.html'">
                <div class="list-left"><span>← My Orders</span></div>
            </div>
            <div class="list-item" onclick="window.location.href='my-wishlist.html'">
                <div class="list-left"><span>← My Wishlist</span></div>
            </div>
        </div>

        <!-- Delivery Address Section -->
        <div class="section-card">
            <h3>Delivery Address</h3>
            <form onsubmit="event.preventDefault(); alert('Address Saved!');">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" class="form-control" placeholder="Full Name" required>
                </div>
                <div class="form-group">
                    <label>Full Address</label>
                    <input type="text" class="form-control" placeholder="House no, Street, Area" required>
                </div>
                <div class="form-group" style="display:flex; gap:10px;">
                    <div style="flex:1;">
                        <label>State</label>
                        <input type="text" class="form-control" placeholder="State" required>
                    </div>
                    <div style="flex:1;">
                        <label>PIN Code</label>
                        <input type="text" class="form-control" placeholder="PIN" required>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='index.html'"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</div>
        <div class="nav-item" onclick="window.location.href='category.html'"><svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>Categories</div>
        <div class="nav-item active"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>Account</div>
        <div class="nav-item" onclick="window.location.href='index.html?cart=true'"><svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>Cart</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (currentUser) {
                document.getElementById('loggedOutView').style.display = 'none';
                document.getElementById('loggedInView').style.display = 'block';
                const firstName = currentUser.name ? currentUser.name.split(' ')[0] : 'User';
                document.getElementById('greetingText').innerText = `Hey, ${firstName}`;
            } else {
                document.getElementById('loggedOutView').style.display = 'block';
                document.getElementById('loggedInView').style.display = 'none';
            }

            try {
                const res = await fetch('/api/settings');
                const settings = await res.json();
                if(settings.profileBanner) {
                    document.getElementById('profileBannerImg').style.backgroundImage = `url(${settings.profileBanner})`;
                }
            } catch(e) { console.log("Error fetching banner settings", e); }
        });

        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const user = { name: "Demo User", email: email };
            localStorage.setItem('currentUser', JSON.stringify(user));
            alert("Logged in successfully!");
            window.location.reload(); 
        }

        function handleLogout() {
            if(confirm("Kya aap logout karna chahte hain?")) {
                localStorage.removeItem('currentUser');
                alert("Logged out successfully!");
                window.location.reload();
            }
        }
    </script>
</body>
</html>
