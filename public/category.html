<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>All Categories - Indian Celebration</title>
    <!-- Main CSS (Fonts, variables) -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Category Specific CSS -->
    <link rel="stylesheet" href="css/category.css">
</head>
<body>

    <!-- HEADER (No White Border) -->
    <div class="category-header-bar">
        <svg onclick="window.location.href='index.html'" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        <span>All Categories</span>
        <svg onclick="window.location.href='index.html'" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    </div>

    <!-- SPLIT LAYOUT -->
    <div class="category-split-layout">
        
        <!-- SIDEBAR (Independent Scroll) -->
        <div class="category-sidebar">
            <div class="sidebar-item active" onclick="switchTab('for-you', this)">
                <img src="https://cdn-icons-png.flaticon.com/512/10043/10043941.png" style="filter: invert(34%) sepia(93%) saturate(1963%) hue-rotate(202deg) brightness(97%) contrast(95%);"> For You
            </div>
            <div class="sidebar-item" onclick="switchTab('minutes', this)">
                <img src="https://cdn-icons-png.flaticon.com/512/3724/3724788.png" class="cat-icon" data-key="catGrocery"> Grocery
            </div>
            <div class="sidebar-item" onclick="switchTab('boy_fashion', this)">
                <img src="https://cdn-icons-png.flaticon.com/512/3003/3003354.png" class="cat-icon" data-key="catBoy"> Boy
            </div>
            <div class="sidebar-item" onclick="switchTab('children_fashion', this)">
                <img src="https://cdn-icons-png.flaticon.com/512/3011/3011270.png" class="cat-icon" data-key="catChildren"> Children
            </div>
            <div class="sidebar-item" onclick="switchTab('man_fashion', this)">
                <img src="https://cdn-icons-png.flaticon.com/512/3003/3003354.png" class="cat-icon" data-key="catMan"> Man
            </div>
            <div class="sidebar-item" onclick="switchTab('electronics', this)">
                <img src="https://cdn-icons-png.flaticon.com/512/3659/3659899.png" class="cat-icon" data-key="catElectronics"> Electronics
            </div>
            <div class="sidebar-item" onclick="switchTab('festival', this)">
                <img src="https://cdn-icons-png.flaticon.com/512/4213/4213179.png" class="cat-icon" data-key="catFestival"> Festival
            </div>
            <div class="sidebar-item" onclick="switchTab('daily_uses', this)">
                <img src="https://cdn-icons-png.flaticon.com/512/3081/3081559.png" class="cat-icon" data-key="catDailyUses"> Daily Uses
            </div>
        </div>

        <!-- MAIN CONTENT (Independent Scroll) -->
        <div class="category-main-content">
            
            <!-- 1. FOR YOU TAB -->
            <div id="tab-for-you" style="display: block;">
                
                <div class="section-title-premium">Popular Store</div>
                <div class="popular-store-grid">
                    <div class="store-card" onclick="window.location.href='value365.html'">
                        <img src="https://cdn-icons-png.flaticon.com/512/3081/3081559.png">
                        <span>Value 365</span>
                    </div>
                    <div class="store-card" onclick="alert('Flights Coming Soon!')">
                        <img src="https://cdn-icons-png.flaticon.com/512/7893/7893979.png">
                        <span>Flights</span>
                    </div>
                    <div class="store-card" onclick="window.location.href='minutes.html'">
                        <img src="https://cdn-icons-png.flaticon.com/512/3724/3724788.png">
                        <span>Grocery</span>
                    </div>
                </div>

                <div class="section-title-premium">New & Upcoming Launches</div>
                <div class="new-launches-grid" id="newLaunchesGrid">
                    <!-- JS will load here -->
                </div>
            </div>

            <!-- 2. DYNAMIC PRODUCTS TAB (Grocery, Boy, etc.) -->
            <div id="tab-dynamic" class="dynamic-products-wrapper">
                <div class="section-title-premium" id="dynamicTitle">Products</div>
                <div class="product-grid-dynamic" id="dynamicGrid"></div>
            </div>

        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        let allProducts = [];

        async function init() {
            try {
                // Fetch Products and Settings
                const [prodRes, settingsRes] = await Promise.all([
                    fetch('/api/products'),
                    fetch('/api/settings')
                ]);
                allProducts = await prodRes.json();
                const appSettings = await settingsRes.json();

                // Apply Dynamic Icons to Sidebar
                const icons = document.querySelectorAll('.cat-icon');
                icons.forEach(img => {
                    const key = img.getAttribute('data-key');
                    if(appSettings[key]) img.src = appSettings[key];
                });

                // Populate "New & Upcoming Launches"
                renderNewLaunches();

            } catch (e) {
                console.log("Error fetching data", e);
            }
        }
        init();

        // Render Products in "For You" Tab
        function renderNewLaunches() {
            const grid = document.getElementById('newLaunchesGrid');
            const recentProducts = allProducts.slice(0, 6); // First 6 products

            if(recentProducts.length === 0) {
                grid.innerHTML = '<p style="grid-column: span 2; text-align:center;">No new launches.</p>';
                return;
            }

            grid.innerHTML = recentProducts.map(p => `
                <div class="premium-product-card" onclick="window.location.href='product.html?id=${p._id}'">
                    <div class="img-box">
                        <img src="${p.imageUrl}" onerror="this.src='https://via.placeholder.com/150'">
                    </div>
                    <div class="prod-name">${p.name}</div>
                    <div class="price-row">
                        <span class="price">₹${p.price}</span>
                    </div>
                </div>
            `).join('');
        }

        // Tab Switching Logic
        function switchTab(tabId, el) {
            // Update Sidebar Active State
            document.querySelectorAll('.sidebar-item').forEach(item => item.classList.remove('active'));
            el.classList.add('active');

            // Show/Hide Tabs
            if(tabId === 'for-you') {
                document.getElementById('tab-for-you').style.display = 'block';
                document.getElementById('tab-dynamic').style.display = 'none';
            } else {
                document.getElementById('tab-for-you').style.display = 'none';
                document.getElementById('tab-dynamic').style.display = 'block';
                loadDynamicProducts(tabId);
            }
        }

        // Load Dynamic Products
        function loadDynamicProducts(category) {
            const grid = document.getElementById('dynamicGrid');
            const title = document.getElementById('dynamicTitle');
            
            title.innerText = category.replace('_', ' ').toUpperCase() + " PRODUCTS";
            grid.innerHTML = '<p style="grid-column: span 2; text-align:center; padding:20px;">Loading...</p>';

            if(allProducts.length === 0) {
                setTimeout(() => loadDynamicProducts(category), 500);
                return;
            }

            const filtered = allProducts.filter(p => p.category === category);

            if(filtered.length === 0) {
                grid.innerHTML = '<p style="grid-column: span 2; text-align:center; padding:20px;">No products found in this category.</p>';
                return;
            }

            grid.innerHTML = filtered.map(p => `
                <div class="dynamic-card" onclick="window.location.href='product.html?id=${p._id}'">
                    <div class="img-box">
                        <img src="${p.imageUrl}" onerror="this.src='https://via.placeholder.com/150'">
                    </div>
                    <div class="prod-title">${p.name}</div>
                    <div class="prod-price">₹${p.price}</div>
                    <button class="add-btn" onclick="event.stopPropagation(); alert('Added to cart')">Add</button>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
