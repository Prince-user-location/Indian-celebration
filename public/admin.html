<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Indian Celebration</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f8fafc; color: #333; padding-bottom: 50px; }
        
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b2240; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; }
        .login-box h2 { color: #0b2240; margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 15px; outline: none; font-size: 16px; text-align: center; }
        .login-box button { width: 100%; padding: 12px; background: #6366f1; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        #admin-content { display: none; }
        .top-header { background: white; padding: 20px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;}
        .top-header h2 { font-size: 20px; font-weight: 700; color: #1e293b; }
        .btn-logout { background: #fee2e2; color: #dc2626; border: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        
        .tabs-container { display: flex; background: white; border-bottom: 1px solid #e2e8f0; padding: 0 10px; gap: 15px; overflow-x: auto; scrollbar-width: none; }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tab-item { padding: 15px 0; font-size: 14px; font-weight: 600; color: #64748b; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
        .tab-item.active { color: #6366f1; border-bottom-color: #6366f1; }
        
        .content-area { padding: 20px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .section-title { font-size: 18px; font-weight: 700; color: #1e293b; }
        
        .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; }
        .setting-card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; text-align: center; display: flex; flex-direction: column; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .setting-card img { width: 40px; height: 40px; object-fit: contain; margin-bottom: 10px; background: transparent; border-radius: 8px; padding: 2px; }
        .setting-card label { font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 8px; }
        .setting-card input[type="file"] { display: none; }
        .btn-upload { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; width: 100%; text-align: center; }
        
        .btn-save-settings { background: #10b981; color: white; width: 100%; max-width: 300px; padding: 15px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin: 30px auto 0; display: block; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3); }

        .list-container { display: flex; flex-direction: column; gap: 15px; }
        .list-card { background: white; border-radius: 12px; padding: 15px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #e2e8f0; }
        
        .form-modal { display: none; background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .form-modal.active { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 6px; }
        input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
        .btn-save { background: #6366f1; color: white; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-cancel { background: #f1f5f9; color: #475569; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        #imagePreview { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap;}
        #imagePreview img, #imagePreview video { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>🔒 Admin Login</h2>
            <input type="password" id="adminPassword" placeholder="Enter Admin Password">
            <button onclick="checkPassword()">Login</button>
        </div>
    </div>

    <div id="admin-content">
        <div class="top-header">
            <div><h2>Admin Panel</h2></div>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>

        <div class="tabs-container">
            <div class="tab-item active" onclick="switchTab('orders')">Orders</div>
            <div class="tab-item" onclick="switchTab('banner')">Banners</div>
            <div class="tab-item" onclick="switchTab('settings')">⚙️ App Settings</div>
            <div class="tab-item" onclick="switchTab('boy_fashion')">Boy Fashion</div>
            <div class="tab-item" onclick="switchTab('children_fashion')">Children</div>
            <div class="tab-item" onclick="switchTab('man_fashion')">Man Fashion</div>
            <div class="tab-item" onclick="switchTab('electronics')">Electronics</div>
            <div class="tab-item" onclick="switchTab('festival')">Festival</div>
            <div class="tab-item" onclick="switchTab('daily_uses')">Daily Uses</div>
        </div>

        <div class="content-area">
            <div class="section-header" id="normalHeader">
                <div class="section-title" id="sectionTitle">Orders</div>
                <button id="addBtn" onclick="showForm()" style="background:#6366f1; color:white; border:none; padding:10px 15px; border-radius:6px; font-weight:bold; display:none;">+ Add New</button>
            </div>

            <!-- APP SETTINGS UI -->
            <div id="settingsArea" style="display:none;">
                <h2 style="font-size:18px; margin-bottom:15px; color:#0b2240;">Update Website Icons & Banners</h2>
                <div class="settings-grid" id="settingsGrid"></div>
                <button class="btn-save-settings" onclick="saveSettings()">Save All Settings</button>
            </div>

            <!-- PRODUCT FORM -->
            <div class="form-modal" id="addForm">
                <form id="itemForm">
                    <input type="hidden" id="itemId">
                    <input type="hidden" id="itemType" value="banner">
                    <div class="form-group" id="nameGroup" style="display:none;"><label>Product Name</label><input type="text" id="pName"></div>
                    <div class="form-group" id="priceGroup" style="display:none; gap:10px;">
                        <div style="flex:1;"><label>Price (₹)</label><input type="number" id="pPrice"></div>
                        <div style="flex:1;"><label>Old Price (₹)</label><input type="number" id="pOldPrice"></div>
                    </div>
                    <div class="form-group" id="descGroup" style="display:none;"><label>Description</label><textarea id="pDesc" rows="2"></textarea></div>
                    <div class="form-group" id="timerGroup" style="display:none;"><label>Offer Timer (Hours)</label><input type="number" id="pTimer"></div>
                    <div class="form-group" id="deliveryGroup" style="display:none;"><label>Expected Delivery Date</label><input type="date" id="pDeliveryDate"></div>
                    <div class="form-group" id="stockGroup" style="display:none;"><label>Available Stock</label><input type="number" id="pStock"></div>
                    
                    <div class="form-group"><label>Upload Image or Video</label><input type="file" id="pImageFiles" accept="image/*,video/*" multiple><div id="imagePreview"></div></div>
                    
                    <button type="submit" class="btn-save" id="btnSubmit">Save</button>
                    <button type="button" class="btn-cancel" onclick="hideForm()">Cancel</button>
                </form>
            </div>

            <div class="list-container" id="listContainer"></div>
        </div>
    </div>

    <script>
        const API_URL = "";
        const ADMIN_PASSWORD = "prince123"; 
        let currentTab = 'orders';
        let appSettings = {};

        window.onload = () => { 
            if(sessionStorage.getItem('isAdminLoggedIn') === 'true') { 
                document.getElementById('login-screen').style.display = 'none'; 
                document.getElementById('admin-content').style.display = 'block'; 
                switchTab('orders'); 
            } 
        }

        function checkPassword() { 
            const pass = document.getElementById('adminPassword').value; 
            if(pass === ADMIN_PASSWORD) { 
                sessionStorage.setItem('isAdminLoggedIn', 'true'); 
                document.getElementById('login-screen').style.display = 'none'; 
                document.getElementById('admin-content').style.display = 'block'; 
                switchTab('orders'); 
            } else { alert("❌ Wrong Password!"); } 
        }
        
        function logout() { sessionStorage.removeItem('isAdminLoggedIn'); window.location.reload(); }

        async function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');

            if(tab === 'settings') {
                document.getElementById('settingsArea').style.display = 'block';
                document.getElementById('normalHeader').style.display = 'none';
                document.getElementById('listContainer').style.display = 'none';
                document.getElementById('addForm').classList.remove('active');
                await fetchSettings();
            } else {
                document.getElementById('settingsArea').style.display = 'none';
                document.getElementById('normalHeader').style.display = 'flex';
                document.getElementById('listContainer').style.display = 'flex';
                document.getElementById('sectionTitle').innerText = tab.charAt(0).toUpperCase() + tab.slice(1);
                document.getElementById('addBtn').style.display = (tab === 'orders') ? 'none' : 'block';
                loadList();
            }
        }

        async function fetchSettings() {
            try {
                const res = await fetch(`${API_URL}/api/settings`);
                appSettings = await res.json();
                
                const iconConfigs = [
                    { key: 'offlineImg', name: 'Offline Dog Image' }, // NAYA
                    { key: 'profileBanner', name: 'Profile Banner' },
                    { key: 'tabWeekly', name: 'Weekly Tab' },
                    { key: 'tabTravel', name: 'Travel Tab' },
                    { key: 'tabValue365', name: 'Value 365 Tab' },
                    { key: 'tabGifts', name: 'Gifts Tab' },
                    { key: 'iconAccount', name: 'Header Account' },
                    { key: 'iconHelp', name: 'Header Help' },
                    { key: 'iconCart', name: 'Header Cart' },
                    { key: 'catGrocery', name: 'Grocery Category' },
                    { key: 'catBoy', name: 'Boy Category' },
                    { key: 'catChildren', name: 'Children Category' },
                    { key: 'catMan', name: 'Man Category' },
                    { key: 'catElectronics', name: 'Electronics Category' },
                    { key: 'catFestival', name: 'Festival Category' },
                    { key: 'catDailyUses', name: 'Daily Uses Category' }
                ];

                let html = '';
                iconConfigs.forEach(cfg => {
                    const currentImg = appSettings[cfg.key] || "https://cdn-icons-png.flaticon.com/512/149/149071.png";
                    const isBanner = cfg.key === 'profileBanner' || cfg.key === 'offlineImg';
                    
                    html += `
                        <div class="setting-card" style="${isBanner ? 'grid-column: span 2;' : ''}">
                            <img src="${currentImg}" id="preview_${cfg.key}" style="${isBanner ? 'width:100%; height:80px;' : ''}">
                            <label>${cfg.name}</label>
                            <input type="file" id="input_${cfg.key}" accept="image/*" onchange="previewImage(this, '${cfg.key}')">
                            <div class="btn-upload" onclick="document.getElementById('input_${cfg.key}').click()">Upload</div>
                        </div>
                    `;
                });
                document.getElementById('settingsGrid').innerHTML = html;
            } catch(e) { console.error(e); alert("Error loading settings"); }
        }

        function previewImage(input, key) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById(`preview_${key}`).src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function saveSettings() {
            const formData = new FormData();
            const keys = ['offlineImg', 'profileBanner', 'tabWeekly', 'tabTravel', 'tabValue365', 'tabGifts', 'iconAccount', 'iconHelp', 'iconCart', 'catGrocery', 'catBoy', 'catChildren', 'catMan', 'catElectronics', 'catFestival', 'catDailyUses'];
            
            let hasFile = false;
            keys.forEach(key => {
                const fileInput = document.getElementById(`input_${key}`);
                if(fileInput && fileInput.files.length > 0) {
                    formData.append(key, fileInput.files[0]);
                    hasFile = true;
                }
            });

            if(!hasFile) return alert("Please select at least one image to update.");

            try {
                const res = await fetch(`${API_URL}/api/admin/settings`, { method: 'POST', body: formData });
                if(res.ok) {
                    alert("✅ Settings Updated Successfully!");
                    fetchSettings(); 
                } else {
                    alert("❌ Error updating settings");
                }
            } catch(e) { alert("❌ Server error!"); }
        }

        document.getElementById('pImageFiles').addEventListener('change', function(e) {
            const preview = document.getElementById('imagePreview');
            preview.innerHTML = '';
            Array.from(e.target.files).forEach(file => {
                if(file.type.startsWith('image/')) {
                    const img = document.createElement('img');
                    img.src = URL.createObjectURL(file);
                    preview.appendChild(img);
                } else if(file.type.startsWith('video/')) {
                    const vid = document.createElement('video');
                    vid.src = URL.createObjectURL(file);
                    vid.muted = true;
                    preview.appendChild(vid);
                }
            });
        });

        document.getElementById('itemForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('itemId').value;
            const type = document.getElementById('itemType').value;
            const fileInput = document.getElementById('pImageFiles');

            const formData = new FormData();
            formData.append('itemType', type);

            if(type === 'banner' || type === 'halfbanner') {
                if(fileInput.files.length > 0) formData.append('image', fileInput.files[0]);
                formData.append('type', type === 'halfbanner' ? 'half' : 'top');
                await fetch(`${API_URL}/api/admin/banner`, { method: 'POST', body: formData });
            } else {
                formData.append('name', document.getElementById('pName').value);
                formData.append('price', document.getElementById('pPrice').value);
                formData.append('oldPrice', document.getElementById('pOldPrice').value);
                formData.append('category', type);
                formData.append('description', document.getElementById('pDesc').value);
                formData.append('timerHours', document.getElementById('pTimer').value);
                formData.append('deliveryDate', document.getElementById('pDeliveryDate').value);
                formData.append('stock', document.getElementById('pStock').value);

                for (let i = 0; i < fileInput.files.length; i++) {
                    formData.append('images', fileInput.files[i]);
                }

                const url = id ? `${API_URL}/api/admin/product/${id}` : `${API_URL}/api/admin/product`;
                const method = id ? 'PUT' : 'POST';
                await fetch(url, { method: method, body: formData });
            }
            
            alert("✅ Saved Successfully!");
            hideForm();
            loadList();
        });

        function showForm() { document.getElementById('addForm').classList.add('active'); }
        function hideForm() { document.getElementById('addForm').classList.remove('active'); document.getElementById('itemForm').reset(); document.getElementById('imagePreview').innerHTML = ''; }

        async function loadList() {
            const container = document.getElementById('listContainer');
            container.innerHTML = 'Loading...';

            try {
                if(currentTab === 'orders') {
                    const res = await fetch(`${API_URL}/api/orders`);
                    const orders = await res.json();
                    if(orders.length === 0) { container.innerHTML = '<p style="text-align:center;">No orders yet.</p>'; return; }
                    
                    container.innerHTML = orders.map(o => `
                        <div class="list-card" style="flex-direction: column; align-items: flex-start;">
                            <div style="display:flex; justify-content:space-between; width:100%; border-bottom:1px solid #eee; padding-bottom:5px; margin-bottom:5px;">
                                <b>ID: ${o.id}</b> <span style="color:${o.status === 'Paid / Verified' ? 'green' : 'orange'}">${o.status}</span>
                            </div>
                            <div><b>User:</b> ${o.user}</div>
                            <div style="font-size:12px; color:#666;"><b>Address:</b> ${o.address}</div>
                            <div style="margin-top:5px;"><b>Total:</b> ₹${o.total}</div>
                        </div>
                    `).join('');
                } 
                else if(currentTab === 'banner' || currentTab === 'halfbanner') {
                    const res = await fetch(`${API_URL}/api/banners`);
                    let banners = await res.json();
                    
                    if(currentTab === 'halfbanner') { banners = banners.filter(b => b.type === 'half'); } 
                    else { banners = banners.filter(b => b.type !== 'half'); }

                    if(banners.length === 0) { container.innerHTML = '<p style="text-align:center;">No banners found.</p>'; return; }

                    container.innerHTML = banners.map(b => `
                        <div class="list-card">
                            <div style="display:flex; align-items:center; gap:10px;">
                                ${b.mediaType === 'video' ? `<video src="${b.imageUrl}" style="width:80px; height:40px; object-fit:cover; border-radius:6px;" muted></video>` : `<img src="${b.imageUrl}" style="width:80px; height:40px; object-fit:cover; border-radius:6px;">`}
                                <div><b>${currentTab === 'halfbanner' ? 'Half Banner' : 'Top Banner'}</b></div>
                            </div>
                            <button onclick="deleteItem('banner', '${b._id}')" style="background:#fee2e2; color:#dc2626; border:none; padding:6px 10px; border-radius:6px; font-weight:bold;">Del</button>
                        </div>
                    `).join('');
                } 
                else {
                    const res = await fetch(`${API_URL}/api/products`);
                    let products = await res.json();
                    const filtered = products.filter(p => p.category === currentTab);

                    if(filtered.length === 0) { container.innerHTML = '<p style="text-align:center;">No products found.</p>'; return; }

                    container.innerHTML = filtered.map(p => `
                        <div class="list-card">
                            <div style="display:flex; align-items:center; gap:10px;">
                                <img src="${p.imageUrl}" style="width:50px; height:50px; object-fit:contain; border-radius:6px;">
                                <div>
                                    <div style="font-size:14px; font-weight:bold;">${p.name}</div>
                                    <div style="font-size:12px; color:#666;">₹${p.price} | Stock: ${p.stock}</div>
                                </div>
                            </div>
                            <div style="display:flex; gap:5px;">
                                <button onclick="editItem('${p._id}')" style="background:#f1f5f9; border:none; padding:6px 10px; border-radius:6px; font-weight:bold;">Edit</button>
                                <button onclick="deleteItem('product', '${p._id}')" style="background:#fee2e2; color:#dc2626; border:none; padding:6px 10px; border-radius:6px; font-weight:bold;">Del</button>
                            </div>
                        </div>
                    `).join('');
                }
            } catch(e) { 
                container.innerHTML = 'Error loading data.'; 
            }
        }

        async function deleteItem(type, id) {
            if(!confirm("Are you sure?")) return;
            const url = type === 'product' ? `${API_URL}/api/admin/product/${id}` : `${API_URL}/api/admin/banner/${id}`;
            await fetch(url, { method: 'DELETE' });
            alert("🗑️ Deleted!");
            loadList();
        }
    </script>
</body>
</html>
