<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Value 365 - Indian Celebration</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .v365-header { background: #fff; padding: 15px; display: flex; align-items: center; gap: 15px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .v365-banner { background: #d32f2f; color: white; padding: 20px; border-radius: 12px; text-align: center; margin: 15px; }
        .v365-banner h2 { font-size: 24px; font-weight: 900; letter-spacing: 1px; }
        .v365-deals { display: flex; gap: 10px; overflow-x: auto; padding: 0 15px 15px 15px; }
        .deal-card { min-width: 140px; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; cursor: pointer; }
        .deal-card img { width: 100%; height: 120px; object-fit: contain; padding: 10px; }
        .deal-card h4 { font-size: 12px; padding: 0 5px; margin-bottom: 5px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .deal-card p { font-size: 14px; font-weight: bold; background: #d32f2f; color: white; padding: 5px; }
    </style>
</head>
<body>
    <div class="v365-header">
        <svg onclick="window.location.href='index.html'" width="24" height="24" viewBox="0 0 24 24" fill="#333" style="cursor:pointer;"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        <span style="color: #d32f2f; font-weight: bold;">VALUE 365</span>
    </div>

    <div class="v365-banner">
        <h2>VALUE 365</h2>
        <p style="font-size:14px; margin-top:5px;">LOWEST PRICES EVERY DAY.</p>
    </div>

    <div class="section-title" style="margin:0;">Flash Hour Deals</div>
    <div class="v365-deals" id="dealsContainer"></div>

    <div class="section-title" style="margin:0;">All Deals</div>
    <!-- Yahan se padding hata di hai -->
    <div id="productsContainer" style="background:#f1f3f6; min-height: 50vh;"></div>

    <div class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='index.html'"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</div>
        <div class="nav-item active"><svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>Categories</div>
    </div>

    <script>
        async function loadValueProducts() {
            try {
                const res = await fetch('/api/products');
                const allProducts = await res.json();
                const valueProducts = allProducts.filter(p => p.category === 'value365');

                if(valueProducts.length === 0) {
                    document.getElementById('productsContainer').innerHTML = '<p style="text-align:center; padding:20px;">No products found.</p>';
                    return;
                }

                // Flash Deals
                const dealsContainer = document.getElementById('dealsContainer');
                dealsContainer.innerHTML = valueProducts.slice(0, 4).map(p => `
                    <div class="deal-card" onclick="window.location.href='product.html?id=${p._id}'">
                        <img src="${p.imageUrl}">
                        <h4>${p.name}</h4>
                        <p>Just ₹${p.price}</p>
                    </div>
                `).join('');

                // All Deals Grid
                const productsContainer = document.getElementById('productsContainer');
                let html = '';
                valueProducts.forEach(p => {
                    // Card HTML Fixed
                    html += `
                        <div class="card">
                            <div class="card-img-container" onclick="window.location.href='product.html?id=${p._id}'">
                                <img src="${p.imageUrl}" class="card-img">
                            </div>
                            <div class="card-details">
                                <div class="card-title" onclick="window.location.href='product.html?id=${p._id}'">${p.name}</div>
                                <div class="price-row"><span class="price">₹${p.price}</span></div>
                                <div class="card-btn-group">
                                    <button class="btn-add-meesho" onclick="event.stopPropagation(); alert('Added to cart (Demo)')">Add</button>
                                    <button class="btn-buy-meesho" onclick="event.stopPropagation(); alert('Buy Now (Demo)')">Buy Now</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                productsContainer.innerHTML = `<div class="grid">${html}</div>`;
            } catch(e) { console.log(e); }
        }
        loadValueProducts();
    </script>
</body>
</html>
